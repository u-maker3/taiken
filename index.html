<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>49歳うめこのアプリ工房</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;color:#30283d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fff0f7,#eae7ff);min-height:100vh}.wrap{max-width:560px;margin:auto;padding:20px 16px 70px}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 12px 35px #4933661c;margin:14px 0}h1{font-size:26px;margin:8px 0}h2{font-size:21px}p{line-height:1.8}.tag{font-size:12px;color:#765d98;letter-spacing:2px}.btn{border:0;border-radius:40px;background:#7653ba;color:#fff;padding:14px 22px;font-size:16px;font-weight:700;cursor:pointer;min-height:48px}.btn.secondary{background:#f2eafa;color:#654a91}.btn:disabled{opacity:.45}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}input,textarea,select{font:inherit;border:1px solid #d9cde9;border-radius:12px;padding:12px;width:100%;margin:6px 0 14px}label{font-weight:700;font-size:14px}.choices{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.choice{border:2px solid #ddd2ed;background:white;padding:11px;border-radius:12px;cursor:pointer}.choice.active{border-color:#7856c3;background:#f4edff}.preview{padding:28px 16px;text-align:center;border-radius:22px;min-height:220px}.preview h2{overflow-wrap:anywhere}.preview button{border:0;padding:14px 25px;font-size:16px;color:#fff;font-weight:bold;cursor:pointer}.hidden{display:none}.progress{height:8px;border-radius:8px;background:#e3d7ee;overflow:hidden}.progress>div{height:100%;background:#8564c9;transition:width .2s}.hint{font-size:13px;color:#756785}.result{font-size:20px;font-weight:bold;min-height:40px;margin-top:20px;white-space:pre-wrap}.note{background:#f9f5ff;border-radius:12px;padding:12px;font-size:14px}a{color:#6b48a4}.footer{text-align:center;font-size:12px;color:#867b94}</style></head><body><main class="wrap"><div class="tag">UMEKO PRESENTS ✨</div><h1>あんたもアプリ作れるで。</h1><div class="progress"><div id="bar"></div></div><div id="app" class="card"></div><p class="footer">49歳うめこのアプリ工房｜入力内容は外部送信しません</p></main><script>
const $=id=>document.getElementById(id);const themes={pink:{name:'ももいろ',bg:'#fff0f5',fg:'#bd3275',btn:'#ed5d9a'},blue:{name:'そらいろ',bg:'#e9f6ff',fg:'#24639c',btn:'#438ed1'},purple:{name:'むらさき',bg:'#f0eaff',fg:'#6544a2',btn:'#8d6bd0'},yellow:{name:'きいろ',bg:'#fff6da',fg:'#80600e',btn:'#c99a28'}};const state={step:0,name:'わたしのおみくじ',theme:'pink',shape:'round',messages:['今日はええ日になる予感！','焦らんでええ。ぼちぼちいこ。','笑う門には福来るで！']};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function btn(text,fn,secondary=false){let b=document.createElement('button');b.className='btn'+(secondary?' secondary':'');b.textContent=text;b.onclick=fn;return b}function nav(next=true){let d=document.createElement('div');d.className='actions';if(state.step>0)d.append(btn('戻る',()=>{state.step--;render()},true));if(next)d.append(btn(state.step===5?'完成！':'次へ進む →',()=>{state.step++;render()}));return d}function preview(interactive=false){let t=themes[state.theme],d=document.createElement('div');d.className='preview';d.style.background=t.bg;let h=document.createElement('h2');h.textContent='✨ '+(state.name||'名前のないアプリ');h.style.color=t.fg;d.append(h);let p=document.createElement('p');p.textContent='今日のあんた、どないやろ？';p.style.color=t.fg;d.append(p);let b=document.createElement('button');b.textContent='おみくじを引く';b.style.background=t.btn;b.style.borderRadius=state.shape==='round'?'40px':'7px';d.append(b);let r=document.createElement('div');r.className='result';r.style.color=t.fg;d.append(r);if(interactive)b.onclick=()=>r.textContent=state.messages[Math.floor(Math.random()*state.messages.length)];else b.onclick=()=>{};return d}function heading(d,title,body){let h=document.createElement('h2');h.textContent=title;d.append(h);if(body){let p=document.createElement('p');p.textContent=body;d.append(p)}}function render(){let d=$('app');d.replaceChildren();$('bar').style.width=(state.step/6*100)+'%';if(state.step===0){heading(d,'いらっしゃい、アプリ工房へ！','プログラマーちゃう49歳うめこが案内するで。今日はあんた専用のミニおみくじを作ってみよか！');let p=document.createElement('p');p.className='note';p.textContent='所要時間の目安：約3〜5分。コードの知識は不要やで。';d.append(p,btn('ほな、作ってみよ！',()=>{state.step=1;render()}))}else if(state.step===1){heading(d,'① まず名前を決めよ！','自分のアプリやから、好きな名前でええんよ。');let l=document.createElement('label');l.textContent='アプリの名前';let i=document.createElement('input');i.maxLength=40;i.value=state.name;i.oninput=()=>state.name=i.value;d.append(l,i,nav())}else if(state.step===2){heading(d,'② 好きな色にしてみ！','色を変えたら、アプリの雰囲気もガラッと変わるで。');let c=document.createElement('div');c.className='choices';Object.entries(themes).forEach(([k,v])=>{let b=document.createElement('button');b.className='choice'+(state.theme===k?' active':'');b.textContent=v.name;b.onclick=()=>{state.theme=k;render()};c.append(b)});d.append(c,preview(),nav())}else if(state.step===3){heading(d,'③ ボタンの形も選べるで！','ちょっと変えるだけでも、自分らしくなるやろ？');let c=document.createElement('div');c.className='choices';[['round','まんまる'],['square','四角め']].forEach(([k,v])=>{let b=document.createElement('button');b.className='choice'+(state.shape===k?' active':'');b.textContent=v;b.onclick=()=>{state.shape=k;render()};c.append(b)});d.append(c,preview(),nav())}else if(state.step===4){heading(d,'④ 中身を仕込むで！','おみくじで出てくる文章を3つ書いてな。');state.messages.forEach((m,j)=>{let l=document.createElement('label');l.textContent='メッセージ '+(j+1);let a=document.createElement('textarea');a.rows=2;a.maxLength=150;a.value=m;a.oninput=()=>state.messages[j]=a.value;d.append(l,a)});d.append(nav())}else if(state.step===5){heading(d,'⑤ ほな、動かしてみ！','ボタンを何回か押してみて。あんたが入れた言葉が出てくるで！');d.append(preview(true),nav())}else{heading(d,'🎉 アプリ職人、誕生！','ほら、ちゃんと動いたやろ！これが「作る」の第一歩や。');d.append(preview(true));let actions=document.createElement('div');actions.className='actions';actions.append(btn('HTMLを保存',download),btn('もう一回作る',()=>{state.step=0;render()},true));d.append(actions);let p=document.createElement('p');p.className='note';p.textContent='HTMLを保存したら、ブラウザで開いて遊べるで。公開やホーム画面への追加には別の手順が必要やで。';d.append(p);let h=document.createElement('h2');h.textContent='もっと作ってみたなった？';d.append(h);let desc=document.createElement('p');desc.textContent='これは入口。本格的な自分専用アプリを作りたい人は、うめこと一緒にやろか。対面講座 30,000円〜／和歌山開催・最大2名。';d.append(desc);let a=document.createElement('a');a.href='https://lin.ee/7ZQGLgk';a.target='_blank';a.rel='noopener noreferrer';a.textContent='公式LINEで相談する ↗';d.append(a)}}function download(){let t=themes[state.theme];let safe=s=>JSON.stringify(s).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026');let doc=`<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(state.name)}</title><style>body{font-family:system-ui,sans-serif;background:${t.bg};color:${t.fg};text-align:center;padding:50px 16px}h1{overflow-wrap:anywhere}button{background:${t.btn};border:0;color:white;border-radius:${state.shape==='round'?'40px':'7px'};padding:16px 28px;font-size:18px}#result{font-size:22px;font-weight:bold;white-space:pre-wrap;margin:30px auto;max-width:600px}</style></head><body><h1 id="name"></h1><p>今日のあんた、どないやろ？</p><button id="draw">おみくじを引く</button><div id="result"></div><script>const name=${safe(state.name)},messages=${safe(state.messages)};document.getElementById('name').textContent='✨ '+name;document.getElementById('draw').onclick=()=>document.getElementById('result').textContent=messages[Math.floor(Math.random()*messages.length)];<\/script></body></html>`;let blob=new Blob([doc],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-omikuji.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}render();
</script></body></html>
